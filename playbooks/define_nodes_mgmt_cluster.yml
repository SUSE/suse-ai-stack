---
- name: Define Nodes for the Mgmt Cluster
  hosts: localhost
  connection: local
  tasks:
  - name: Define master node - mgmt cluster
    ansible.builtin.add_host:
      ansible_python_interpreter: "{{ python_interpreter }}"
      name: mgmt-rancher
      hostname: mgmt-rancher
      ansible_user: "{{ vm_ansible_user | default('ai') }}"
      ansible_host: "{{ vm_ip }}"
      groups:
        - mgmt_cp_master
        - mgmt_cluster

  - name: Define other control plane nodes - mgmt cluster
    ansible.builtin.add_host:
      ansible_python_interpreter: "{{ python_interpreter }}"
      name: "{{ item.name }}"
      hostname: "{{ item.hostname }}"
      ansible_user: "{{ vm_ansible_user | default('ai') }}"
      ansible_host: "{{ item.ip }}"
      groups:
        - mgmt_cp_others
        - mgmt_cluster
    loop: "{{ mgmt_cp_others | default([]) }}"

  - name: Define worker nodes with GPU - mgmt cluster
    ansible.builtin.add_host:
      ansible_python_interpreter: "{{ python_interpreter }}"
      name: "{{ item.name }}"
      hostname: "{{ item.hostname }}"
      ansible_user: "{{ vm_ansible_user | default('ai') }}"
      ansible_host: "{{ item.ip }}"
      groups:
        - mgmt_agents_gpu
        - mgmt_agents
        - mgmt_cluster
    loop: "{{ mgmt_worker_gpu | default([]) }}"

  - name: Define worker nodes with no GPU - mgmt cluster
    ansible.builtin.add_host:
      ansible_python_interpreter: "{{ python_interpreter }}"
      name: "{{ item.name }}"
      hostname: "{{ item.hostname }}"
      ansible_user: "{{ vm_ansible_user | default('ai') }}"
      ansible_host: "{{ item.ip }}"
      groups:
        - mgmt_agents_nongpu
        - mgmt_agents
        - mgmt_cluster
    loop: "{{ mgmt_worker_nongpu | default([]) }}"

  - name: Save dynamic inventory to inventories/mgmt_inventory.ini
    copy:
      dest: "../inventories/mgmt_inventory.ini"
      content: |
        [rke2_servers]
        {% for host in groups['mgmt_cp_master'] %}
        mgmt-rancher ansible_host={{ hostvars[host].ansible_host }}
        {% endfor %}
        {% for host in groups['mgmt_cp_others'] | default([]) %}
        mgmt-rancher-cp{{ loop.index }} ansible_host={{ hostvars[host].ansible_host }}
        {% endfor %}
        [rke2_agents]
        {% for host in groups['mgmt_agents_gpu'] | default([]) %}
        mgmt-rancher-wkrgpu{{ loop.index }} ansible_host={{ hostvars[host].ansible_host }}
        {% endfor %}
        {% for host in groups['mgmt_agents_nongpu'] | default([]) %}
        mgmt-rancher-wkr{{ loop.index }} ansible_host={{ hostvars[host].ansible_host }}
        {% endfor %}
        [all:vars]
        ansible_user="{{ vm_ansible_user | default('ai') }}"

  - name: Set python-PyYAML package name
    set_fact:
      mgmt_pyyaml_package_name: "{{ 'python313-PyYAML' if cluster.image_distro == 'sles' and cluster.image_distro_version.startswith('16')  else 'python311-PyYAML' }}"
    when: cluster is defined

  - name: Set python-PyYAML package name
    set_fact:
      mgmt_pyyaml_package_name: 'python311-PyYAML'
    when: cluster is not defined

  # Resolve the SUSE AI Factory (aif-operator) chart version.
  # Precedence: suse_ai_factory.version from extra_vars (explicit override),
  # otherwise the latest stable chart version published to the OCI registry.
  # The registry lookup requires 'helm' on the ansible controller node. When SUSE AI
  # Factory is enabled and no version is pinned, an unresolved version is a hard
  # error (see the assert below) rather than a silent fallback. The lookup is
  # skipped during destroy (aif_skip_version_resolution), where it is not needed.
  - name: Use SUSE AI Factory chart version from extra_vars (override)
    set_fact:
      suse_ai_factory_version: "{{ suse_ai_factory.version }}"
    when:
      - suse_ai_factory is defined
      - suse_ai_factory.version is defined

  - name: Fetch latest SUSE AI Factory (aif-operator) chart version
    ansible.builtin.command:
      cmd: "helm show chart {{ suse_ai_factory_chart_repo | default('oci://ghcr.io/suse/chart/aif-operator') }}"
    register: aif_chart_info
    changed_when: false
    failed_when: false
    when:
      - not (aif_skip_version_resolution | default(false))
      - suse_ai_factory is defined
      - suse_ai_factory.enabled | default(false)
      - suse_ai_factory.version is not defined

  - name: Set latest SUSE AI Factory chart version as default
    set_fact:
      suse_ai_factory_version: "{{ (_aif_version_lines | first).split(':')[1] | trim }}"
    vars:
      _aif_version_lines: "{{ (aif_chart_info.stdout_lines | default([])) | select('match', '^version:') | list }}"
    when:
      - suse_ai_factory is defined
      - suse_ai_factory.version is not defined
      - (aif_chart_info.rc | default(1)) == 0
      - _aif_version_lines | length > 0

  - name: Ensure SUSE AI Factory chart version was resolved
    assert:
      that:
        - suse_ai_factory_version is defined
      fail_msg: >-
        Could not resolve the latest aif-operator chart version. Ensure 'helm'
        is installed on the ansible controller node and the registry
        ({{ suse_ai_factory_chart_repo | default('oci://ghcr.io/suse/chart/aif-operator') }})
        is reachable, or pin suse_ai_factory.version in extra_vars.yml.
    when:
      - not (aif_skip_version_resolution | default(false))
      - suse_ai_factory is defined
      - suse_ai_factory.enabled | default(false)
      - suse_ai_factory.version is not defined


  - name: Build mgmt extra_vars content
    set_fact:
      mgmt_extra_vars_content: |
        ---
        # SCC
        scc_registration:
          server: {{ registration_server | default("https://scc.suse.com") }}
          email: {{ registration_email }}
          sles_code: "{{ sles_registration_code }}"
          sle_micro_code: "{{ sle_micro_registration_code }}"

        # Nvidia
        nvidia:
          driver_install: {{ (false if (use_nvidia_driver_installer | default(false)) else (enable_nvidia_driver_pkg_install | default(true))) | lower }}
          gpu_operator_deploy: {{ (false if (use_nvidia_driver_installer | default(false)) else (enable_gpu_operator | default(false))) | lower }}
          gpu_operator_version: {{  gpu_operator_chart_version | default('25.10.1')}}

        # RKE2
        rke2:
          version:  {{ cluster.version | default('v1.34.4+rke2r1') }}
          token: {{ cluster.token | default('mgmt-rke2token') }}
          lb_address: "{{ hostvars['localhost']['kubeapi_fqdn'] }}"

        # Rancher
        rancher:
          enabled: true
          version: {{ rancher_version | default('2.13.1') }} #version should be compatible with rke2.version
          replicas: {{ rancher_replicas | default(1) }}
          hostname: {{ hostvars['localhost']['rancher_host'] }}
          bootstrap_password: {{ rancher_bootstrap_password | default('rancher')}}
          use_prime: {{ use_rancher_prime | default(false) }}
          prime_helm_repo_url: "{{ rancher_prime_helm_repo_url | default('') }}"
        {% if cloud_provider is defined and cloud_provider == "aws" and enable_external_dns | default(false) %}
          extraAnnotations:
            external-dns.alpha.kubernetes.io/target: {{ hostvars['localhost']['ingress_fqdn'] }}
            external-dns.alpha.kubernetes.io/ttl: "60"
        {% endif %}
        suse_packages: {{
          (["open-iscsi", "nfs-client", "cryptsetup", "device-mapper"]
          if enable_longhorn | default(false) else [])
          + ["jq",
            mgmt_pyyaml_package_name,
            "curl", "git", "pciutils"]
        }}

        suse_ai_factory:
          enabled: {{ suse_ai_factory.enabled | default(false) }}
          version: {{ suse_ai_factory_version | default('2.0.0') }}

          ai_extension:
            enabled: {{ suse_ai_factory.ai_extension.enabled | default(false) }}

        {% if (application_collection_user_token | default("") | length > 0) or (nvidia_token | default("") | length > 0) or (suse_ai_registration_code | default("") | length > 0) %}
          credentials:
        {% if application_collection_user_token | default("") | length > 0 %}
            # credential for oci://dp.apps.rancher.io/charts
            applicationCollection:
              username: {{ application_collection_user_email | default("") }}
              password: {{ application_collection_user_token }}
        {% endif %}
        {% if nvidia_token | default("") | length > 0 %}
            # credential to pull NGC artifacts
            # e.g. https://helm.ngc.nvidia.com/nvidia
            nvidia:
              username: {{ nvidia_user | default('$oauthtoken') }}
              password: {{ nvidia_token }}
        {% endif %}
        {% if suse_ai_registration_code | default("") | length > 0 %}
            # credential for oci://registry.suse.com/ai/charts
            suseRegistry:
              username: {{ suse_ai_registry_user | default('regcode') }}
              password: {{ suse_ai_registration_code }}
        {% endif %}
        {% endif %}

  - name: Save mgmt_extra_vars.yml
    copy:
      dest: "../mgmt_extra_vars.yml"
      content: "{{ mgmt_extra_vars_content }}"
