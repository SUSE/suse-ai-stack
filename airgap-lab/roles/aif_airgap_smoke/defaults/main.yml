---
smoke_chart_version: "0.1.0"
smoke_blueprint_mode: "rendered"
smoke_blueprint_reference_name: >-
  {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower))
     if smoke_blueprint_mode == 'rendered'
     else 'git-sourced-airgap' }}
smoke_blueprint_resource_name: >-
  {{ smoke_blueprint_reference_name ~ '-' ~
     (smoke_chart_version | regex_replace('[^0-9A-Za-z]+', '-') | lower) }}
smoke_release_name: "{{ smoke_workload_name }}-{{ smoke_strategy | lower }}"
smoke_chart_repo: "application-collection"
smoke_verify_registry_reroute: false
smoke_primary_registry_endpoint: "oci://{{ harbor_hostname }}/{{ appco_chart_project }}"
smoke_reroute_registry_endpoint: "oci://{{ harbor_hostname }}/{{ suse_chart_project }}"
smoke_verify_fleet_branch_change: false
smoke_fleet_branch: "main"
smoke_fleet_alternate_branch: "airgap-republish"
smoke_git_auth_type: "current"
smoke_fleet_resource_kind: "helmop"
