---
- name: Validate the smoke journey
  ansible.builtin.assert:
    that:
      - smoke_strategy in ['FleetBundle', 'GitOps']
      - smoke_blueprint_mode in ['rendered', 'preprovisioned']
      - smoke_fleet_resource_kind in ['helmop', 'bundle']
      - not (smoke_verify_registry_reroute | bool) or smoke_fleet_resource_kind == 'helmop'
      - not (smoke_verify_registry_reroute | bool) or smoke_chart_repo == 'application-collection'
      - not (smoke_verify_fleet_branch_change | bool) or smoke_strategy == 'GitOps'
      - not ((smoke_verify_registry_reroute | bool) and (smoke_verify_fleet_branch_change | bool))
      - smoke_blueprint_mode != 'preprovisioned' or smoke_chart_repo == 'application-collection'
      - smoke_target_clusters | length > 0
      - smoke_target_clusters | unique | list | length == smoke_target_clusters | length
      - smoke_timeout_seconds | int >= 60
      - smoke_chart_version is regex('^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
      - smoke_namespace is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
      - smoke_workload_name is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
      - smoke_case_id is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
      - smoke_display_name | length > 0
      - smoke_release_name | length <= 53
      - smoke_release_name is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
      - smoke_chart_repo is regex('^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$')
      - not (smoke_verify_registry_reroute | bool) or smoke_primary_registry_endpoint is regex('^oci://[^/]+/.+')
      - not (smoke_verify_registry_reroute | bool) or smoke_reroute_registry_endpoint is regex('^oci://[^/]+/.+')
      - not (smoke_verify_registry_reroute | bool) or smoke_primary_registry_endpoint != smoke_reroute_registry_endpoint
      - smoke_fleet_branch is regex('^[0-9A-Za-z](?:[-0-9A-Za-z._/]*[0-9A-Za-z])?$')
      - smoke_fleet_alternate_branch is regex('^airgap-[0-9A-Za-z](?:[-0-9A-Za-z._]*[0-9A-Za-z])?$')
      - smoke_fleet_branch != smoke_fleet_alternate_branch
      - aif_namespace is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
    fail_msg: >-
      Choose FleetBundle or GitOps, a direct ClusterRepo name, and at least one
      unique Rancher cluster ID. Registry rerouting requires an OCI HelmOp case;
      Fleet branch switching requires GitOps and a disposable airgap-* branch.

- name: Require AIF and Fleet to use the unified private Git HTTPS credentials
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      settings=$("${kubectl}" -n {{ aif_namespace | quote }} get settings settings \
        -o json --kubeconfig "${kubeconfig}")
      generation=$(jq -r '.metadata.generation' <<<"${settings}")
      observed=$(jq -r '.status.observedGeneration // 0' <<<"${settings}")
      auth_type=$(jq -r '.spec.fleet.authType // ""' <<<"${settings}")
      configured_username=$(jq -r '.spec.fleet.username // ""' <<<"${settings}")
      mirror_type=$("${kubectl}" -n fleet-local get secret gitops-credentials \
        -o jsonpath='{.type}' --kubeconfig "${kubeconfig}" 2>/dev/null || true)
      mirror_username=$("${kubectl}" -n fleet-local get secret gitops-credentials \
        -o jsonpath='{.data.username}' --kubeconfig "${kubeconfig}" 2>/dev/null \
        | base64 -d || true)
      git_ready=$("${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
        -o json --kubeconfig "${kubeconfig}" 2>/dev/null \
        | jq -r '[.status.conditions[]? | select(.type == "GitPolling") | .status][-1] // ""' \
        || true)
      if [[ "${generation}" == "${observed}" \
         && -z "${auth_type}" \
         && "${configured_username}" == {{ gitea_admin_username | quote }} \
         && "${mirror_type}" == "kubernetes.io/basic-auth" \
         && "${mirror_username}" == {{ gitea_admin_username | quote }} \
         && "${git_ready}" == "True" ]]; then
        exit 0
      fi
      sleep 5
    done
    "${kubectl}" -n {{ aif_namespace | quote }} get settings settings -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Remove the previous matrix workload before a deterministic retry
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    "${kubectl}" get namespace {{ smoke_namespace | quote }} \
      --kubeconfig "${kubeconfig}" >/dev/null 2>&1 || exit 0
    "${kubectl}" -n {{ smoke_namespace | quote }} delete aiworkload \
      {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
      --ignore-not-found=true --wait=true --timeout=5m \
      --kubeconfig "${kubeconfig}"
  args:
    executable: /bin/bash
  register: smoke_previous_workload_delete
  changed_when: "'deleted' in smoke_previous_workload_delete.stdout"

- name: Remove prior Fleet resources for the same matrix case
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    bundle={{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower) ~ '-airgap-smoke') | quote }}
    for kind in helmop bundle; do
      "${kubectl}" get "${kind}" --all-namespaces -o json \
        --kubeconfig "${kubeconfig}" \
        | jq -r --arg bundle "${bundle}" \
            '.items[] | select(.metadata.name == $bundle) | [.metadata.namespace, .metadata.name] | @tsv' \
        | while IFS=$'\t' read -r namespace name; do
            [[ -n "${namespace}" && -n "${name}" ]] || continue
            "${kubectl}" -n "${namespace}" delete "${kind}" "${name}" \
              --wait=true --timeout=2m --kubeconfig "${kubeconfig}"
          done
    done
  args:
    executable: /bin/bash
  register: smoke_previous_fleet_delete
  changed_when: "'deleted' in smoke_previous_fleet_delete.stdout"

- name: Remove the previous matrix Blueprint before a deterministic retry
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl delete blueprint
      {{ smoke_blueprint_resource_name }}
      --ignore-not-found=true --wait=true --timeout=2m
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  register: smoke_previous_blueprint_delete
  changed_when: "'deleted' in smoke_previous_blueprint_delete.stdout"
  when: smoke_blueprint_mode == 'rendered'

- name: Create smoke staging directory
  ansible.builtin.file:
    path: /var/lib/aif-airgap-smoke
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render the no-GPU Blueprint and AIWorkload
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/var/lib/aif-airgap-smoke/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { src: aiworkload.yaml.j2, dest: aiworkload.yaml }

- name: Render the no-GPU Blueprint
  ansible.builtin.template:
    src: blueprint.yaml.j2
    dest: /var/lib/aif-airgap-smoke/blueprint.yaml
    owner: root
    group: root
    mode: "0600"
  when: smoke_blueprint_mode == 'rendered'

- name: Create the smoke target namespace
  ansible.builtin.shell: |
    set -euo pipefail
    /var/lib/rancher/rke2/bin/kubectl create namespace {{ smoke_namespace | quote }} \
      --dry-run=client -o yaml --kubeconfig /etc/rancher/rke2/rke2.yaml \
      | /var/lib/rancher/rke2/bin/kubectl apply -f - \
          --kubeconfig /etc/rancher/rke2/rke2.yaml
  args:
    executable: /bin/bash
  register: smoke_namespace_apply
  changed_when: "'created' in smoke_namespace_apply.stdout or 'configured' in smoke_namespace_apply.stdout"

- name: Apply the smoke Blueprint
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl apply
      --filename /var/lib/aif-airgap-smoke/blueprint.yaml
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  register: smoke_blueprint_apply
  changed_when: "'created' in smoke_blueprint_apply.stdout or 'configured' in smoke_blueprint_apply.stdout"
  when: smoke_blueprint_mode == 'rendered'

- name: Wait for the Blueprint delivered from private Gitea
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl wait blueprint/{{ smoke_blueprint_resource_name }}
      --for=jsonpath='{.metadata.labels.airgap-lab\.suse\.com/source}'=private-gitea
      --timeout={{ smoke_timeout_seconds | int }}s
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when: smoke_blueprint_mode == 'preprovisioned'
  changed_when: false

- name: Require the stored Blueprint to use a direct stable ClusterRepo reference
  ansible.builtin.shell: |
    set -euo pipefail
    /var/lib/rancher/rke2/bin/kubectl get blueprint \
      {{ smoke_blueprint_resource_name | quote }} \
      -o json --kubeconfig /etc/rancher/rke2/rke2.yaml \
      | jq -e \
          --arg repo {{ smoke_chart_repo | quote }} \
          --arg version {{ smoke_chart_version | quote }} '
          .spec.components as $components |
          ($components | length > 0) and
          ($components | all(.chartRepo == $repo)) and
          ($components | all(.chartName == "airgap-smoke")) and
          ($components | all(.chartVersion == $version)) and
          ($components | all((.applicationRef // null) == null))'
  args:
    executable: /bin/bash
  changed_when: false

- name: Reset Fleet to the baseline branch before branch-change qualification
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} patch settings settings
      --type merge
      --patch {{ {'spec': {'fleet': {'branch': smoke_fleet_branch}}} | to_json | quote }}
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when: smoke_verify_fleet_branch_change | bool
  changed_when: true

- name: Require Fleet to observe the baseline branch
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    expected={{ smoke_fleet_branch | quote }}
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      settings=$({ "${kubectl}" -n {{ aif_namespace | quote }} get settings settings \
        -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
      gitrepo=$({ "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
        -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
      generation=$(jq -r '.metadata.generation // 0' <<<"${settings}")
      observed=$(jq -r '.status.observedGeneration // -1' <<<"${settings}")
      settings_branch=$(jq -r '.spec.fleet.branch // "main"' <<<"${settings}")
      repo_branch=$(jq -r '.spec.branch // ""' <<<"${gitrepo}")
      polling=$(jq -r '[.status.conditions[]? | select(.type == "GitPolling") | .status][-1] // ""' <<<"${gitrepo}")
      accepted=$(jq -r '[.status.conditions[]? | select(.type == "Accepted") | .status][-1] // ""' <<<"${gitrepo}")
      if [[ "${generation}" == "${observed}" \
         && "${settings_branch}" == "${expected}" \
         && "${repo_branch}" == "${expected}" \
         && "${polling}" == "True" \
         && "${accepted}" == "True" ]]; then
        exit 0
      fi
      sleep 5
    done
    "${kubectl}" -n {{ aif_namespace | quote }} get settings settings -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    exit 1
  args:
    executable: /bin/bash
  when: smoke_verify_fleet_branch_change | bool
  changed_when: false

- name: Inspect the alternate Fleet branch
  ansible.builtin.uri:
    url: >-
      {{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository
      }}/branches/{{ smoke_fleet_alternate_branch | urlencode }}
    method: GET
    url_username: "{{ gitea_admin_username }}"
    url_password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
    status_code: [200, 404]
  when: smoke_verify_fleet_branch_change | bool
  register: smoke_alternate_branch
  no_log: true

- name: Remove an earlier alternate Fleet branch
  ansible.builtin.uri:
    url: >-
      {{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository
      }}/branches/{{ smoke_fleet_alternate_branch | urlencode }}
    method: DELETE
    url_username: "{{ gitea_admin_username }}"
    url_password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
    status_code: 204
  when:
    - smoke_verify_fleet_branch_change | bool
    - (smoke_alternate_branch.status | default(404)) == 200
  no_log: true

- name: Create a clean alternate Fleet branch from the baseline
  ansible.builtin.uri:
    url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository }}/branches"
    method: POST
    url_username: "{{ gitea_admin_username }}"
    url_password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
    body_format: json
    body:
      new_branch_name: "{{ smoke_fleet_alternate_branch }}"
      old_ref_name: "{{ smoke_fleet_branch }}"
    status_code: 201
  when: smoke_verify_fleet_branch_change | bool
  no_log: true

- name: Require the alternate branch not to contain this workload yet
  ansible.builtin.uri:
    url: >-
      {{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository
      }}/contents/workloads/{{ smoke_workload_name }}-{{ smoke_strategy | lower
      }}-airgap-smoke.yaml?ref={{ smoke_fleet_alternate_branch | urlencode }}
    method: GET
    url_username: "{{ gitea_admin_username }}"
    url_password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
    status_code: 404
  when: smoke_verify_fleet_branch_change | bool
  no_log: true

- name: Apply the smoke AIWorkload
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl apply
      --filename /var/lib/aif-airgap-smoke/aiworkload.yaml
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  register: smoke_workload_apply
  changed_when: "'created' in smoke_workload_apply.stdout or 'configured' in smoke_workload_apply.stdout"

- name: Wait for the operator to record the component bundle name
  ansible.builtin.shell: |
    set -euo pipefail
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      name=$(/var/lib/rancher/rke2/bin/kubectl -n {{ smoke_namespace | quote }} \
        get aiworkload {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.spec.fleetBundleNames[0]}' 2>/dev/null || true)
      [[ -n "${name}" ]] && { printf '%s\n' "${name}"; exit 0; }
      sleep 5
    done
    exit 1
  args:
    executable: /bin/bash
  register: smoke_bundle_name
  changed_when: false

- name: Wait for GitOps publication when selected
  when: smoke_strategy == 'GitOps'
  block:
    - name: Wait for the workload file in private Gitea
      ansible.builtin.uri:
        url: >-
          {{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository
          }}/contents/workloads/{{ smoke_bundle_name.stdout | trim }}.yaml?ref={{ smoke_fleet_branch | urlencode }}
        method: GET
        url_username: "{{ gitea_admin_username }}"
        url_password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
        status_code: 200
      register: gitea_workload_file
      retries: 60
      delay: 5
      until: gitea_workload_file.status == 200
      no_log: true


- name: Wait for Fleet to materialize this workload in every target workspace
  ansible.builtin.shell: |
    set -euo pipefail
    bundle={{ smoke_bundle_name.stdout | trim | quote }}
    kind={{ smoke_fleet_resource_kind | quote }}
    targets={{ smoke_target_clusters | to_json | quote }}
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    mapfile -t namespaces < <(
      jq -r '
        (if index("local") then "fleet-local" else empty end),
        (if any(. != "local") then "fleet-default" else empty end)
      ' <<<"${targets}"
    )
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      missing=false
      for namespace in "${namespaces[@]}"; do
        if ! "${kubectl}" -n "${namespace}" get "${kind}" "${bundle}" \
          --kubeconfig "${kubeconfig}" >/dev/null 2>&1; then
          missing=true
        fi
      done
      if [[ "${missing}" == false ]]; then
        if [[ "${kind}" == bundle ]]; then
          for namespace in "${namespaces[@]}"; do
            object=$("${kubectl}" -n "${namespace}" get bundle "${bundle}" \
              -o json --kubeconfig "${kubeconfig}")
            jq -e '
              (.spec.helm.chart == "airgap-smoke") and
              any(.spec.resources[]?; .name == "airgap-smoke/Chart.yaml") and
              ((.spec.targets // []) | length > 0)
            ' <<<"${object}" >/dev/null || { missing=true; break; }
          done
        fi
      fi
      if [[ "${missing}" == false ]]; then
        for namespace in "${namespaces[@]}"; do
          printf '%s/%s\n' "${namespace}" "${bundle}"
        done
        exit 0
      fi
      sleep 5
    done
    "${kubectl}" get "${kind}" --all-namespaces -o wide \
      --kubeconfig "${kubeconfig}" >&2 || true
    if [[ {{ (smoke_strategy == 'GitOps') | lower }} == true ]]; then
      "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml \
        --kubeconfig "${kubeconfig}" >&2 || true
    fi
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Reapply the compatibility CA after AIF materializes the HelmOp
  when:
    - aif_registry_ca_mode == 'workaround'
    - smoke_fleet_resource_kind == 'helmop'
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    bundle={{ smoke_bundle_name.stdout | trim | quote }}
    targets={{ smoke_target_clusters | to_json | quote }}
    mapfile -t namespaces < <(
      jq -r '
        (if index("local") then "fleet-local" else empty end),
        (if any(. != "local") then "fleet-default" else empty end)
      ' <<<"${targets}"
    )
    ca=$(/usr/bin/base64 -w 0 /var/lib/aif-airgap-lab-ca.crt)
    for namespace in cattle-system fleet-local fleet-default; do
      for secret in application-collection-auth suse-ai-registry-auth ngc-helm-auth; do
        "${kubectl}" -n "${namespace}" patch secret "${secret}" \
          --type merge --patch "{\"data\":{\"cacerts\":\"${ca}\"}}" \
          --kubeconfig "${kubeconfig}" >/dev/null
      done
    done
    for namespace in "${namespaces[@]}"; do
      "${kubectl}" -n "${namespace}" annotate helmop "${bundle}" \
        airgap-lab.suse.com/ca-retry="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite \
        --kubeconfig "${kubeconfig}" >/dev/null
    done
  args:
    executable: /bin/bash
  changed_when: true

- name: Require Fleet to accept the compatibility-CA HelmOp
  when:
    - aif_registry_ca_mode == 'workaround'
    - smoke_fleet_resource_kind == 'helmop'
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    bundle={{ smoke_bundle_name.stdout | trim | quote }}
    targets={{ smoke_target_clusters | to_json | quote }}
    mapfile -t namespaces < <(
      jq -r '
        (if index("local") then "fleet-local" else empty end),
        (if any(. != "local") then "fleet-default" else empty end)
      ' <<<"${targets}"
    )
    ca=$(/usr/bin/base64 -w 0 /var/lib/aif-airgap-lab-ca.crt)
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      all_accepted=true
      for namespace in "${namespaces[@]}"; do
        object=$("${kubectl}" -n "${namespace}" get helmop "${bundle}" \
          -o json --kubeconfig "${kubeconfig}" 2>/dev/null || true)
        helm_secret=$(jq -r '.spec.helmSecretName // ""' <<<"${object}")
        accepted=$(jq -r '[.status.conditions[]? | select(.type == "Accepted") | .status][-1] // ""' <<<"${object}")
        if [[ -n "${helm_secret}" && "${accepted}" == "True" ]]; then
          continue
        fi
        all_accepted=false
        [[ -n "${helm_secret}" ]] || continue
        # The compatibility path races the AIF controller, which may regenerate
        # this Secret without cacerts after the HelmOp first appears. Restore the
        # CA on every retry and retrigger Fleet until it observes the patched copy.
        "${kubectl}" -n "${namespace}" patch secret "${helm_secret}" \
          --type merge --patch "{\"data\":{\"cacerts\":\"${ca}\"}}" \
          --kubeconfig "${kubeconfig}" >/dev/null
        "${kubectl}" -n "${namespace}" annotate helmop "${bundle}" \
          airgap-lab.suse.com/ca-retry="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite \
          --kubeconfig "${kubeconfig}" >/dev/null
      done
      [[ "${all_accepted}" == true ]] && exit 0
      sleep 5
    done
    printf 'Fleet did not accept every compatibility-CA HelmOp for %s\n' "${bundle}" >&2
    for namespace in "${namespaces[@]}"; do
      "${kubectl}" -n "${namespace}" get helmop "${bundle}" -o yaml \
        --kubeconfig "${kubeconfig}" >&2 || true
    done
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Wait for the smoke AIWorkload to become Running
  ansible.builtin.shell: |
    set -euo pipefail
    expected={{ smoke_target_clusters | to_json | quote }}
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      object=$(/var/lib/rancher/rke2/bin/kubectl -n {{ smoke_namespace | quote }} \
        get aiworkload {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o json 2>/dev/null || true)
      if jq -e --argjson expected "${expected}" '
          . as $workload |
          ($workload.status.phase == "Running") and
          ($expected | all(. as $cluster |
            any($workload.status.clusterStatuses[]?;
              .clusterId == $cluster and .phase == "Running")))
        ' <<<"${object}" >/dev/null 2>&1; then
        exit 0
      fi
      phase=$(jq -r '.status.phase // ""' <<<"${object}")
      # Degraded is transient while one target is still progressing. Preserve
      # the bounded wait and fail fast only for the terminal Failed phase.
      [[ "${phase}" == "Failed" ]] && break
      sleep 5
    done
    /var/lib/rancher/rke2/bin/kubectl -n {{ smoke_namespace | quote }} \
      get aiworkload {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} -o yaml \
      --kubeconfig /etc/rancher/rke2/rke2.yaml >&2 || true
    /var/lib/rancher/rke2/bin/kubectl get helmop,bundle -A \
      --kubeconfig /etc/rancher/rke2/rke2.yaml >&2 || true
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Require the combined pull secret to use only the effective private registry host
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    mirror_host={{ harbor_hostname | quote }}
    dockerconfig=$("${kubectl}" -n {{ smoke_namespace | quote }} get secret \
      suse-ai-pull-combined -o jsonpath='{.data.\.dockerconfigjson}' \
      --kubeconfig "${kubeconfig}" | base64 -d)
    jq -e --arg host "${mirror_host}" '
        (.auths[$host].username | length > 0) and
        (.auths[$host].password | length > 0) and
        (.auths | has("dp.apps.rancher.io") | not) and
        (.auths | has("registry.suse.com") | not)
      ' <<<"${dockerconfig}" >/dev/null
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify stable ClusterRepo rerouting without changing the Blueprint
  when: smoke_verify_registry_reroute | bool
  block:
    - name: Capture the Blueprint and ClusterRepo identity before rerouting
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        blueprint_hash=$("${kubectl}" get blueprint {{ smoke_blueprint_resource_name | quote }} \
          -o json --kubeconfig "${kubeconfig}" \
          | jq -cS '.spec' | sha256sum | awk '{print $1}')
        repo=$("${kubectl}" get clusterrepo application-collection \
          -o json --kubeconfig "${kubeconfig}")
        repo_uid=$(jq -r '.metadata.uid' <<<"${repo}")
        repo_url=$(jq -r '.spec.url // .spec.ociRepo // ""' <<<"${repo}")
        [[ -n "${repo_uid}" ]]
        [[ "${repo_url}" == {{ smoke_primary_registry_endpoint | quote }} ]]
        jq -cn \
          --arg blueprintHash "${blueprint_hash}" \
          --arg repoUID "${repo_uid}" \
          '{blueprintHash: $blueprintHash, repoUID: $repoUID}'
      args:
        executable: /bin/bash
      register: smoke_registry_reroute_identity
      changed_when: false

    - name: Capture Fleet state before rerouting the stable ClusterRepo
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        bundle={{ smoke_bundle_name.stdout | trim | quote }}
        targets={{ smoke_target_clusters | to_json | quote }}
        mapfile -t namespaces < <(
          jq -r '
            (if index("local") then "fleet-local" else empty end),
            (if any(. != "local") then "fleet-default" else empty end)
          ' <<<"${targets}"
        )
        state='{}'
        for namespace in "${namespaces[@]}"; do
          resource_version=$("${kubectl}" -n "${namespace}" get helmop "${bundle}" \
            -o jsonpath='{.metadata.resourceVersion}' --kubeconfig "${kubeconfig}")
          state=$(jq -c \
            --arg namespace "${namespace}" \
            --arg resourceVersion "${resource_version}" \
            '. + {($namespace): {resourceVersion: $resourceVersion}}' <<<"${state}")
        done
        printf '%s\n' "${state}"
      args:
        executable: /bin/bash
      register: smoke_helmops_before_reroute
      changed_when: false

    - name: Reroute Application Collection to the second private OCI project
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} patch settings settings
          --type merge
          --patch {{ {'spec': {'registryEndpoints': {
            'applicationCollection': smoke_reroute_registry_endpoint
          }}} | to_json | quote }}
          --kubeconfig /etc/rancher/rke2/rke2.yaml
      changed_when: true

    - name: Require the same ClusterRepo to download from the rerouted endpoint
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        baseline={{ smoke_registry_reroute_identity.stdout | trim | quote }}
        expected_uid=$(jq -r '.repoUID' <<<"${baseline}")
        expected_url={{ smoke_reroute_registry_endpoint | quote }}
        deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
        while (( SECONDS < deadline )); do
          settings=$({ "${kubectl}" -n {{ aif_namespace | quote }} get settings settings \
            -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
          repo=$({ "${kubectl}" get clusterrepo application-collection \
            -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
          settings_generation=$(jq -r '.metadata.generation // 0' <<<"${settings}")
          settings_observed=$(jq -r '.status.observedGeneration // -1' <<<"${settings}")
          configured=$(jq -r '.spec.registryEndpoints.applicationCollection // ""' <<<"${settings}")
          repo_uid=$(jq -r '.metadata.uid // ""' <<<"${repo}")
          repo_url=$(jq -r '.spec.url // .spec.ociRepo // ""' <<<"${repo}")
          repo_generation=$(jq -r '.metadata.generation // 0' <<<"${repo}")
          repo_observed=$(jq -r '.status.observedGeneration // -1' <<<"${repo}")
          downloaded=$(jq -r '[.status.conditions[]? | select(.type == "OCIDownloaded") | .status][-1] // ""' <<<"${repo}")
          if [[ "${settings_generation}" == "${settings_observed}" \
             && "${configured}" == "${expected_url}" \
             && "${repo_uid}" == "${expected_uid}" \
             && "${repo_url}" == "${expected_url}" \
             && "${repo_generation}" == "${repo_observed}" \
             && "${downloaded}" == "True" ]]; then
            exit 0
          fi
          sleep 5
        done
        "${kubectl}" -n {{ aif_namespace | quote }} get settings settings -o yaml \
          --kubeconfig "${kubeconfig}" >&2 || true
        "${kubectl}" get clusterrepo application-collection -o yaml \
          --kubeconfig "${kubeconfig}" >&2 || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Require every Fleet workspace to use the rerouted endpoint
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        bundle={{ smoke_bundle_name.stdout | trim | quote }}
        targets={{ smoke_target_clusters | to_json | quote }}
        baseline={{ smoke_helmops_before_reroute.stdout | trim | quote }}
        expected={{ ((smoke_reroute_registry_endpoint | regex_replace('/+$', '')) ~ '/airgap-smoke') | quote }}
        expected_secret=$("${kubectl}" get clusterrepo application-collection \
          -o jsonpath='{.spec.clientSecret.name}' --kubeconfig "${kubeconfig}")
        [[ -n "${expected_secret}" ]]
        mapfile -t namespaces < <(
          jq -r '
            (if index("local") then "fleet-local" else empty end),
            (if any(. != "local") then "fleet-default" else empty end)
          ' <<<"${targets}"
        )
        deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
        while (( SECONDS < deadline )); do
          all_ready=true
          for namespace in "${namespaces[@]}"; do
            object=$("${kubectl}" -n "${namespace}" get helmop "${bundle}" -o json \
              --kubeconfig "${kubeconfig}" 2>/dev/null || true)
            before=$(jq -r --arg namespace "${namespace}" \
              '.[$namespace].resourceVersion // ""' <<<"${baseline}")
            repo=$(jq -r '.spec.helm.repo // ""' <<<"${object}")
            helm_secret=$(jq -r '.spec.helmSecretName // ""' <<<"${object}")
            resource_version=$(jq -r '.metadata.resourceVersion // ""' <<<"${object}")
            accepted=$(jq -r '[.status.conditions[]? | select(.type == "Accepted") | .status][-1] // ""' <<<"${object}")
            ready=$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][-1] // ""' <<<"${object}")
            desired=$(jq -r '.status.desiredReadyClusters // 0' <<<"${object}")
            actual=$(jq -r '.status.readyClusters // 0' <<<"${object}")
            if [[ "${repo}" != "${expected}" \
               || "${helm_secret}" != "${expected_secret}" \
               || -z "${resource_version}" \
               || "${resource_version}" == "${before}" \
               || "${accepted}" != "True" \
               || "${ready}" != "True" \
               || "${desired}" == 0 \
               || "${actual}" != "${desired}" ]]; then
              all_ready=false
            fi
            if ! "${kubectl}" -n "${namespace}" get secret "${expected_secret}" -o json \
              --kubeconfig "${kubeconfig}" 2>/dev/null \
              | jq -e '.data.username and .data.password and .data.cacerts' >/dev/null; then
              all_ready=false
            fi
          done
          workload=$("${kubectl}" -n {{ smoke_namespace | quote }} get aiworkload \
            {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
            -o json --kubeconfig "${kubeconfig}" 2>/dev/null || true)
          jq -e --argjson expected "${targets}" '
              . as $workload |
              ($workload.status.phase == "Running") and
              ($expected | all(. as $cluster |
                any($workload.status.clusterStatuses[]?;
                  .clusterId == $cluster and .phase == "Running")))
            ' <<<"${workload}" >/dev/null 2>&1 || all_ready=false
          [[ "${all_ready}" == true ]] && exit 0
          sleep 5
        done
        for namespace in "${namespaces[@]}"; do
          "${kubectl}" -n "${namespace}" get helmop "${bundle}" -o yaml \
            --kubeconfig "${kubeconfig}" >&2 || true
        done
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Prove rerouting preserved the Blueprint and ClusterRepo identities
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        baseline={{ smoke_registry_reroute_identity.stdout | trim | quote }}
        expected_blueprint=$(jq -r '.blueprintHash' <<<"${baseline}")
        expected_repo_uid=$(jq -r '.repoUID' <<<"${baseline}")
        actual_blueprint=$("${kubectl}" get blueprint {{ smoke_blueprint_resource_name | quote }} \
          -o json --kubeconfig "${kubeconfig}" \
          | jq -cS '.spec' | sha256sum | awk '{print $1}')
        actual_repo_uid=$("${kubectl}" get clusterrepo application-collection \
          -o jsonpath='{.metadata.uid}' --kubeconfig "${kubeconfig}")
        [[ "${actual_blueprint}" == "${expected_blueprint}" ]]
        [[ "${actual_repo_uid}" == "${expected_repo_uid}" ]]
      args:
        executable: /bin/bash
      changed_when: false
  always:
    - name: Restore the primary Application Collection endpoint
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} patch settings settings
          --type merge
          --patch {{ {'spec': {'registryEndpoints': {
            'applicationCollection': smoke_primary_registry_endpoint
          }}} | to_json | quote }}
          --kubeconfig /etc/rancher/rke2/rke2.yaml
      changed_when: true

    - name: Require the primary endpoint and workload source to be healthy again
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        endpoint={{ smoke_primary_registry_endpoint | quote }}
        expected_repo={{ ((smoke_primary_registry_endpoint | regex_replace('/+$', '')) ~ '/airgap-smoke') | quote }}
        bundle={{ smoke_bundle_name.stdout | trim | quote }}
        targets={{ smoke_target_clusters | to_json | quote }}
        mapfile -t namespaces < <(
          jq -r '
            (if index("local") then "fleet-local" else empty end),
            (if any(. != "local") then "fleet-default" else empty end)
          ' <<<"${targets}"
        )
        deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
        while (( SECONDS < deadline )); do
          repo=$({ "${kubectl}" get clusterrepo application-collection \
            -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
          repo_url=$(jq -r '.spec.url // .spec.ociRepo // ""' <<<"${repo}")
          generation=$(jq -r '.metadata.generation // 0' <<<"${repo}")
          observed=$(jq -r '.status.observedGeneration // -1' <<<"${repo}")
          downloaded=$(jq -r '[.status.conditions[]? | select(.type == "OCIDownloaded") | .status][-1] // ""' <<<"${repo}")
          all_ready=true
          for namespace in "${namespaces[@]}"; do
            helmop=$({ "${kubectl}" -n "${namespace}" get helmop "${bundle}" \
              -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
            helm_repo=$(jq -r '.spec.helm.repo // ""' <<<"${helmop}")
            ready=$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][-1] // ""' <<<"${helmop}")
            [[ "${helm_repo}" == "${expected_repo}" && "${ready}" == "True" ]] || all_ready=false
          done
          if [[ "${repo_url}" == "${endpoint}" \
             && "${generation}" == "${observed}" \
             && "${downloaded}" == "True" \
             && "${all_ready}" == true ]]; then
            exit 0
          fi
          sleep 5
        done
        "${kubectl}" get clusterrepo application-collection -o yaml \
          --kubeconfig "${kubeconfig}" >&2 || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

- name: Verify GitOps republication after changing the Fleet branch
  when: smoke_verify_fleet_branch_change | bool
  block:
    - name: Capture Blueprint and Fleet identities before switching branches
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        blueprint_hash=$("${kubectl}" get blueprint {{ smoke_blueprint_resource_name | quote }} \
          -o json --kubeconfig "${kubeconfig}" \
          | jq -cS '.spec' | sha256sum | awk '{print $1}')
        gitrepo=$("${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
          -o json --kubeconfig "${kubeconfig}")
        uid=$(jq -r '.metadata.uid' <<<"${gitrepo}")
        commit=$(jq -r '.status.commit // ""' <<<"${gitrepo}")
        [[ -n "${uid}" && -n "${commit}" ]]
        jq -cn \
          --arg blueprintHash "${blueprint_hash}" \
          --arg gitRepoUID "${uid}" \
          --arg commit "${commit}" \
          '{blueprintHash: $blueprintHash, gitRepoUID: $gitRepoUID, commit: $commit}'
      args:
        executable: /bin/bash
      register: smoke_fleet_branch_identity
      changed_when: false

    - name: Switch Fleet and AIF publication to the alternate branch
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} patch settings settings
          --type merge
          --patch {{ {'spec': {'fleet': {
            'branch': smoke_fleet_alternate_branch
          }}} | to_json | quote }}
          --kubeconfig /etc/rancher/rke2/rke2.yaml
      changed_when: true

    - name: Require the same Fleet GitRepo to observe the alternate branch
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        baseline={{ smoke_fleet_branch_identity.stdout | trim | quote }}
        expected_branch={{ smoke_fleet_alternate_branch | quote }}
        expected_uid=$(jq -r '.gitRepoUID' <<<"${baseline}")
        previous_commit=$(jq -r '.commit' <<<"${baseline}")
        deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
        while (( SECONDS < deadline )); do
          settings=$({ "${kubectl}" -n {{ aif_namespace | quote }} get settings settings \
            -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
          gitrepo=$({ "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
            -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
          generation=$(jq -r '.metadata.generation // 0' <<<"${settings}")
          observed=$(jq -r '.status.observedGeneration // -1' <<<"${settings}")
          configured=$(jq -r '.spec.fleet.branch // "main"' <<<"${settings}")
          uid=$(jq -r '.metadata.uid // ""' <<<"${gitrepo}")
          branch=$(jq -r '.spec.branch // ""' <<<"${gitrepo}")
          commit=$(jq -r '.status.commit // ""' <<<"${gitrepo}")
          paths=$(jq -c '.spec.paths // []' <<<"${gitrepo}")
          polling=$(jq -r '[.status.conditions[]? | select(.type == "GitPolling") | .status][-1] // ""' <<<"${gitrepo}")
          accepted=$(jq -r '[.status.conditions[]? | select(.type == "Accepted") | .status][-1] // ""' <<<"${gitrepo}")
          if [[ "${generation}" == "${observed}" \
             && "${configured}" == "${expected_branch}" \
             && "${uid}" == "${expected_uid}" \
             && "${branch}" == "${expected_branch}" \
             && -n "${commit}" \
             && "${commit}" != "${previous_commit}" \
             && "${paths}" == '["blueprints","workloads"]' \
             && "${polling}" == "True" \
             && "${accepted}" == "True" ]]; then
            exit 0
          fi
          sleep 5
        done
        "${kubectl}" -n {{ aif_namespace | quote }} get settings settings -o yaml \
          --kubeconfig "${kubeconfig}" >&2 || true
        "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml \
          --kubeconfig "${kubeconfig}" >&2 || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for AIF to republish the workload on the alternate branch
      ansible.builtin.uri:
        url: >-
          {{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository
          }}/contents/workloads/{{ smoke_bundle_name.stdout | trim
          }}.yaml?ref={{ smoke_fleet_alternate_branch | urlencode }}
        method: GET
        url_username: "{{ gitea_admin_username }}"
        url_password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
        status_code: 200
      register: smoke_alternate_workload_file
      retries: 60
      delay: 5
      until: smoke_alternate_workload_file.status == 200
      no_log: true

    - name: Require the republished workload manifest to remain identical
      ansible.builtin.assert:
        that:
          - >-
            (smoke_alternate_workload_file.json.content | b64decode) ==
            (gitea_workload_file.json.content | b64decode)
        fail_msg: "The alternate Fleet branch received a different workload manifest."
      no_log: true

    - name: Read the alternate branch head after republication
      ansible.builtin.uri:
        url: >-
          {{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository
          }}/branches/{{ smoke_fleet_alternate_branch | urlencode }}
        method: GET
        url_username: "{{ gitea_admin_username }}"
        url_password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
        status_code: 200
      register: smoke_alternate_branch_head
      no_log: true

    - name: Prove branch switching preserved the Blueprint and workload health
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        baseline={{ smoke_fleet_branch_identity.stdout | trim | quote }}
        targets={{ smoke_target_clusters | to_json | quote }}
        expected_commit={{ smoke_alternate_branch_head.json.commit.id | quote }}
        expected_blueprint=$(jq -r '.blueprintHash' <<<"${baseline}")
        actual_blueprint=$("${kubectl}" get blueprint {{ smoke_blueprint_resource_name | quote }} \
          -o json --kubeconfig "${kubeconfig}" \
          | jq -cS '.spec' | sha256sum | awk '{print $1}')
        [[ "${actual_blueprint}" == "${expected_blueprint}" ]]
        deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
        while (( SECONDS < deadline )); do
          fleet_commit=$("${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
            -o jsonpath='{.status.commit}' --kubeconfig "${kubeconfig}" 2>/dev/null || true)
          workload=$("${kubectl}" -n {{ smoke_namespace | quote }} get aiworkload \
            {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
            -o json --kubeconfig "${kubeconfig}" 2>/dev/null || true)
          if [[ "${fleet_commit}" == "${expected_commit}" ]] && \
            jq -e --argjson expected "${targets}" '
              . as $workload |
              ($workload.status.phase == "Running") and
              ($expected | all(. as $cluster |
                any($workload.status.clusterStatuses[]?;
                  .clusterId == $cluster and .phase == "Running")))
            ' <<<"${workload}" >/dev/null 2>&1; then
            exit 0
          fi
          sleep 5
        done
        exit 1
      args:
        executable: /bin/bash
      changed_when: false
  always:
    - name: Restore Fleet to the baseline branch
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} patch settings settings
          --type merge
          --patch {{ {'spec': {'fleet': {
            'branch': smoke_fleet_branch
          }}} | to_json | quote }}
          --kubeconfig /etc/rancher/rke2/rke2.yaml
      changed_when: true

    - name: Require Fleet to become healthy again on the baseline branch
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl=/var/lib/rancher/rke2/bin/kubectl
        kubeconfig=/etc/rancher/rke2/rke2.yaml
        expected={{ smoke_fleet_branch | quote }}
        deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
        while (( SECONDS < deadline )); do
          gitrepo=$({ "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
            -o json --kubeconfig "${kubeconfig}"; } 2>/dev/null || true)
          branch=$(jq -r '.spec.branch // ""' <<<"${gitrepo}")
          polling=$(jq -r '[.status.conditions[]? | select(.type == "GitPolling") | .status][-1] // ""' <<<"${gitrepo}")
          accepted=$(jq -r '[.status.conditions[]? | select(.type == "Accepted") | .status][-1] // ""' <<<"${gitrepo}")
          if [[ "${branch}" == "${expected}" \
             && "${polling}" == "True" \
             && "${accepted}" == "True" ]]; then
            exit 0
          fi
          sleep 5
        done
        "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml \
          --kubeconfig "${kubeconfig}" >&2 || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

- name: Report the successful smoke journey
  ansible.builtin.debug:
    msg: >-
      Blueprint {{ smoke_strategy }} workload
      {{ smoke_namespace }}/{{ smoke_workload_name }}-{{ smoke_strategy | lower }}
      is Running through bundle {{ smoke_bundle_name.stdout | trim }} on
      {{ smoke_target_clusters | join(', ') }}{{
        '; the stable ClusterRepo rerouted without changing the Blueprint'
