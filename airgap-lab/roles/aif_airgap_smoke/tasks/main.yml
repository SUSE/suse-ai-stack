---
- name: Validate the smoke journey
  ansible.builtin.assert:
    that:
      - smoke_strategy in ['FleetBundle', 'GitOps']
      - smoke_application_mode in ['direct', 'logical']
      - smoke_blueprint_mode in ['rendered', 'preprovisioned']
      - smoke_git_auth_type in ['current', 'token', 'basic']
      - smoke_blueprint_mode != 'preprovisioned' or smoke_application_mode == 'logical'
      - smoke_target_clusters | length > 0
      - smoke_target_clusters | unique | list | length == smoke_target_clusters | length
      - smoke_timeout_seconds | int >= 60
      - smoke_chart_version is regex('^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$')
      - smoke_namespace is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
      - smoke_workload_name is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
      - smoke_application_name is regex('^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$')
      - smoke_application_source_ref is regex('^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$')
      - smoke_switch_source_ref is regex('^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$')
      - aif_namespace is regex('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')
    fail_msg: "Choose FleetBundle or GitOps and at least one unique Rancher cluster ID."

- name: Switch the private Git authentication mode for this matrix case
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} patch settings settings
      --type merge
      --patch {{ {'spec': {'fleet': {
        'authType': smoke_git_auth_type,
        'username': (gitea_admin_username if smoke_git_auth_type == 'token' else none)
      }}} | to_json | quote }}
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when: smoke_git_auth_type != 'current'
  changed_when: true

- name: Require AIF and Fleet to observe the selected private Git authentication
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      settings=$("${kubectl}" -n {{ aif_namespace | quote }} get settings settings \
        -o json --kubeconfig "${kubeconfig}")
      generation=$(jq -r '.metadata.generation' <<<"${settings}")
      observed=$(jq -r '.status.observedGeneration // 0' <<<"${settings}")
      auth_type=$(jq -r '.spec.fleet.authType // ""' <<<"${settings}")
      mirror_username=$("${kubectl}" -n fleet-local get secret gitops-credentials \
        -o jsonpath='{.data.username}' --kubeconfig "${kubeconfig}" 2>/dev/null \
        | base64 -d || true)
      git_ready=$("${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
        -o json --kubeconfig "${kubeconfig}" 2>/dev/null \
        | jq -r '[.status.conditions[]? | select(.type == "GitPolling") | .status][-1] // ""' \
        || true)
      if [[ "${generation}" == "${observed}" \
         && "${auth_type}" == {{ smoke_git_auth_type | quote }} \
         && "${mirror_username}" == {{ gitea_admin_username | quote }} \
         && "${git_ready}" == "True" ]]; then
        exit 0
      fi
      sleep 5
    done
    "${kubectl}" -n {{ aif_namespace | quote }} get settings settings -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    exit 1
  args:
    executable: /bin/bash
  when: smoke_git_auth_type != 'current'
  changed_when: false

- name: Remove the previous matrix workload before a deterministic retry
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    "${kubectl}" get namespace {{ smoke_namespace | quote }} \
      --kubeconfig "${kubeconfig}" >/dev/null 2>&1 || exit 0
    "${kubectl}" -n {{ smoke_namespace | quote }} delete aiworkload \
      {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
      --ignore-not-found=true --wait=true --timeout=5m \
      --kubeconfig "${kubeconfig}"
  args:
    executable: /bin/bash
  register: smoke_previous_workload_delete
  changed_when: "'deleted' in smoke_previous_workload_delete.stdout"

- name: Remove prior Fleet resources for the same matrix case
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    bundle={{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower) ~ '-airgap-smoke') | quote }}
    for kind in helmop bundle; do
      "${kubectl}" get "${kind}" --all-namespaces -o json \
        --kubeconfig "${kubeconfig}" \
        | jq -r --arg bundle "${bundle}" \
            '.items[] | select(.metadata.name == $bundle) | [.metadata.namespace, .metadata.name] | @tsv' \
        | while IFS=$'\t' read -r namespace name; do
            [[ -n "${namespace}" && -n "${name}" ]] || continue
            "${kubectl}" -n "${namespace}" delete "${kind}" "${name}" \
              --wait=true --timeout=2m --kubeconfig "${kubeconfig}"
          done
    done
  args:
    executable: /bin/bash
  register: smoke_previous_fleet_delete
  changed_when: "'deleted' in smoke_previous_fleet_delete.stdout"

- name: Remove the previous matrix Blueprint before a deterministic retry
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl delete blueprint
      {{ smoke_blueprint_resource_name }}
      --ignore-not-found=true --wait=true --timeout=2m
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  register: smoke_previous_blueprint_delete
  changed_when: "'deleted' in smoke_previous_blueprint_delete.stdout"
  when: smoke_blueprint_mode == 'rendered'

- name: Create smoke staging directory
  ansible.builtin.file:
    path: /var/lib/aif-airgap-smoke
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render the no-GPU Blueprint and AIWorkload
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/var/lib/aif-airgap-smoke/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { src: aiworkload.yaml.j2, dest: aiworkload.yaml }

- name: Render the no-GPU Blueprint
  ansible.builtin.template:
    src: blueprint.yaml.j2
    dest: /var/lib/aif-airgap-smoke/blueprint.yaml
    owner: root
    group: root
    mode: "0600"
  when: smoke_blueprint_mode == 'rendered'

- name: Render the logical Application mapping
  ansible.builtin.template:
    src: application.yaml.j2
    dest: /var/lib/aif-airgap-smoke/application.yaml
    owner: root
    group: root
    mode: "0600"
  when: smoke_application_mode == 'logical'

- name: Create the smoke target namespace
  ansible.builtin.shell: |
    set -euo pipefail
    /var/lib/rancher/rke2/bin/kubectl create namespace {{ smoke_namespace | quote }} \
      --dry-run=client -o yaml --kubeconfig /etc/rancher/rke2/rke2.yaml \
      | /var/lib/rancher/rke2/bin/kubectl apply -f - \
          --kubeconfig /etc/rancher/rke2/rke2.yaml
  args:
    executable: /bin/bash
  register: smoke_namespace_apply
  changed_when: "'created' in smoke_namespace_apply.stdout or 'configured' in smoke_namespace_apply.stdout"

- name: Apply the logical Application mapping
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl apply
      --filename /var/lib/aif-airgap-smoke/application.yaml
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when: smoke_application_mode == 'logical'
  register: smoke_application_apply
  changed_when: "'created' in smoke_application_apply.stdout or 'configured' in smoke_application_apply.stdout"

- name: Apply the smoke Blueprint
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl apply
      --filename /var/lib/aif-airgap-smoke/blueprint.yaml
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  register: smoke_blueprint_apply
  changed_when: "'created' in smoke_blueprint_apply.stdout or 'configured' in smoke_blueprint_apply.stdout"
  when: smoke_blueprint_mode == 'rendered'

- name: Wait for the Blueprint delivered from private Gitea
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl wait blueprint/{{ smoke_blueprint_resource_name }}
      --for=jsonpath='{.metadata.labels.airgap-lab\.suse\.com/source}'=private-gitea
      --timeout={{ smoke_timeout_seconds | int }}s
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when: smoke_blueprint_mode == 'preprovisioned'
  changed_when: false

- name: Require the stored logical Blueprint to remain source-independent
  ansible.builtin.shell: |
    set -euo pipefail
    /var/lib/rancher/rke2/bin/kubectl get blueprint \
      {{ smoke_blueprint_resource_name | quote }} \
      -o json --kubeconfig /etc/rancher/rke2/rke2.yaml \
      | jq -e --arg application {{ smoke_application_name | quote }} '
          .spec.components as $components |
          ($components | length > 0) and
          ($components | all(.applicationRef.name == $application)) and
          ($components | all((.chartRepo // "") == "")) and
          ($components | all((.chartName // "") == "")) and
          ($components | all((.chartVersion // "") == ""))'
  args:
    executable: /bin/bash
  when:
    - smoke_application_mode == 'logical'
  changed_when: false

- name: Apply the smoke AIWorkload
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl apply
      --filename /var/lib/aif-airgap-smoke/aiworkload.yaml
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  register: smoke_workload_apply
  changed_when: "'created' in smoke_workload_apply.stdout or 'configured' in smoke_workload_apply.stdout"

- name: Wait for the operator to record the component bundle name
  ansible.builtin.shell: |
    set -euo pipefail
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      name=$(/var/lib/rancher/rke2/bin/kubectl -n {{ smoke_namespace | quote }} \
        get aiworkload {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.spec.fleetBundleNames[0]}' 2>/dev/null || true)
      [[ -n "${name}" ]] && { printf '%s\n' "${name}"; exit 0; }
      sleep 5
    done
    exit 1
  args:
    executable: /bin/bash
  register: smoke_bundle_name
  changed_when: false

- name: Wait for GitOps publication when selected
  when: smoke_strategy == 'GitOps'
  block:
    - name: Wait for the workload file in private Gitea
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ gitea_admin_username }}/{{ gitea_repository }}/contents/workloads/{{ smoke_bundle_name.stdout | trim }}.yaml?ref=main"
        method: GET
        url_username: "{{ gitea_admin_username }}"
        url_password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        ca_path: "{{ '/etc/pki/trust/anchors/aif-airgap-lab-ca.crt' if (gitea_tls_enabled | bool) else omit }}"
        status_code: 200
      register: gitea_workload_file
      retries: 60
      delay: 5
      until: gitea_workload_file.status == 200
      no_log: true


- name: Wait for Fleet to materialize this workload's HelmOp
  ansible.builtin.shell: |
    set -euo pipefail
    bundle={{ smoke_bundle_name.stdout | trim | quote }}
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      location=$("${kubectl}" get helmop --all-namespaces -o json \
        --kubeconfig "${kubeconfig}" 2>/dev/null \
        | jq -r --arg bundle "${bundle}" \
            '[.items[] | select(.metadata.name == $bundle)][0]
             | if . == null then empty else .metadata.namespace + "/" + .metadata.name end' \
        || true)
      if [[ -n "${location}" ]]; then
        printf '%s\n' "${location}"
        exit 0
      fi
      sleep 5
    done
    "${kubectl}" get helmop --all-namespaces -o wide \
      --kubeconfig "${kubeconfig}" >&2 || true
    if [[ {{ (smoke_strategy == 'GitOps') | lower }} == true ]]; then
      "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml \
        --kubeconfig "${kubeconfig}" >&2 || true
    fi
    exit 1
  args:
    executable: /bin/bash
  register: smoke_helmop_location
  changed_when: false

- name: Reapply the compatibility CA after AIF materializes the HelmOp
  when:
    - aif_registry_ca_mode == 'workaround'
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    location={{ smoke_helmop_location.stdout | trim | quote }}
    helmop_namespace="${location%%/*}"
    helmop_name="${location#*/}"
    ca=$(/usr/bin/base64 -w 0 /var/lib/aif-airgap-lab-ca.crt)
    for namespace in cattle-system fleet-local fleet-default; do
      for secret in application-collection-auth suse-ai-registry-auth ngc-helm-auth; do
        "${kubectl}" -n "${namespace}" patch secret "${secret}" \
          --type merge --patch "{\"data\":{\"cacerts\":\"${ca}\"}}" \
          --kubeconfig "${kubeconfig}" >/dev/null
      done
    done
    "${kubectl}" -n "${helmop_namespace}" annotate helmop "${helmop_name}" \
      airgap-lab.suse.com/ca-retry="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite \
      --kubeconfig "${kubeconfig}" >/dev/null
  args:
    executable: /bin/bash
  changed_when: true

- name: Require Fleet to accept the compatibility-CA HelmOp
  when:
    - aif_registry_ca_mode == 'workaround'
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    location={{ smoke_helmop_location.stdout | trim | quote }}
    helmop_namespace="${location%%/*}"
    helmop_name="${location#*/}"
    ca=$(/usr/bin/base64 -w 0 /var/lib/aif-airgap-lab-ca.crt)
    helm_secret=$("${kubectl}" -n "${helmop_namespace}" get helmop "${helmop_name}" \
      -o jsonpath='{.spec.helmSecretName}' --kubeconfig "${kubeconfig}")
    [[ -n "${helm_secret}" ]]
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      accepted=$("${kubectl}" -n "${helmop_namespace}" get helmop "${helmop_name}" \
        -o json --kubeconfig "${kubeconfig}" 2>/dev/null \
        | jq -r '[.status.conditions[]? | select(.type == "Accepted") | .status][-1] // ""' \
        || true)
      [[ "${accepted}" == "True" ]] && exit 0
      # The compatibility path races the AIF controller, which may regenerate
      # this Secret without cacerts after the HelmOp first appears. Restore the
      # CA on every retry and retrigger Fleet until it observes the patched copy.
      "${kubectl}" -n "${helmop_namespace}" patch secret "${helm_secret}" \
        --type merge --patch "{\"data\":{\"cacerts\":\"${ca}\"}}" \
        --kubeconfig "${kubeconfig}" >/dev/null
      "${kubectl}" -n "${helmop_namespace}" annotate helmop "${helmop_name}" \
        airgap-lab.suse.com/ca-retry="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite \
        --kubeconfig "${kubeconfig}" >/dev/null
      sleep 5
    done
    printf 'Fleet did not accept compatibility-CA HelmOp %s/%s\n' \
      "${helmop_namespace}" "${helmop_name}" >&2
    "${kubectl}" -n "${helmop_namespace}" get helmop "${helmop_name}" -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Wait for the smoke AIWorkload to become Running
  ansible.builtin.shell: |
    set -euo pipefail
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      phase=$(/var/lib/rancher/rke2/bin/kubectl -n {{ smoke_namespace | quote }} \
        get aiworkload {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.status.phase}' 2>/dev/null || true)
      [[ "${phase}" == "Running" ]] && exit 0
      # Degraded is transient while one target is still progressing. Preserve
      # the bounded wait and fail fast only for the terminal Failed phase.
      [[ "${phase}" == "Failed" ]] && break
      sleep 5
    done
    /var/lib/rancher/rke2/bin/kubectl -n {{ smoke_namespace | quote }} \
      get aiworkload {{ (smoke_workload_name ~ '-' ~ (smoke_strategy | lower)) | quote }} -o yaml \
      --kubeconfig /etc/rancher/rke2/rke2.yaml >&2 || true
    /var/lib/rancher/rke2/bin/kubectl get helmop,bundle -A \
      --kubeconfig /etc/rancher/rke2/rke2.yaml >&2 || true
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Capture the logical Blueprint spec before switching its Application source
  ansible.builtin.shell: |
    set -euo pipefail
    /var/lib/rancher/rke2/bin/kubectl get blueprint \
      {{ smoke_blueprint_resource_name | quote }} \
      -o json --kubeconfig /etc/rancher/rke2/rke2.yaml \
      | jq -cS '.spec' | sha256sum | awk '{print $1}'
  args:
    executable: /bin/bash
  when:
    - smoke_application_mode == 'logical'
    - smoke_verify_source_switch | bool
  register: smoke_blueprint_spec_before_switch
  changed_when: false

- name: Switch only the logical Application to the second private source
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl patch application
      {{ smoke_application_name | quote }} --type merge
      --patch {{ {'spec': {'chart': {'sourceRef': smoke_switch_source_ref}}} | to_json | quote }}
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when:
    - smoke_application_mode == 'logical'
    - smoke_verify_source_switch | bool
  changed_when: true

- name: Wait for Fleet to accept the chart from the switched private source
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    location={{ smoke_helmop_location.stdout | trim | quote }}
    namespace="${location%%/*}"
    name="${location#*/}"
    expected={{ smoke_switch_repo_url | quote }}
    deadline=$((SECONDS + {{ smoke_timeout_seconds | int }}))
    while (( SECONDS < deadline )); do
      object=$("${kubectl}" -n "${namespace}" get helmop "${name}" -o json \
        --kubeconfig "${kubeconfig}" 2>/dev/null || true)
      repo=$(jq -r '.spec.helm.repo // ""' <<<"${object}")
      generation=$(jq -r '.metadata.generation // 0' <<<"${object}")
      observed=$(jq -r '.status.observedGeneration // 0' <<<"${object}")
      accepted=$(jq -r '[.status.conditions[]? | select(.type == "Accepted") | .status][-1] // ""' <<<"${object}")
      if [[ "${repo}" == "${expected}" && "${observed}" == "${generation}" && "${accepted}" == "True" ]]; then
        exit 0
      fi
      sleep 5
    done
    "${kubectl}" -n "${namespace}" get helmop "${name}" -o yaml \
      --kubeconfig "${kubeconfig}" >&2 || true
    exit 1
  args:
    executable: /bin/bash
  when:
    - smoke_application_mode == 'logical'
    - smoke_verify_source_switch | bool
  changed_when: false

- name: Prove the source switch did not mutate the Blueprint requirement
  ansible.builtin.shell: |
    set -euo pipefail
    after=$(/var/lib/rancher/rke2/bin/kubectl get blueprint \
      {{ smoke_blueprint_resource_name | quote }} \
      -o json --kubeconfig /etc/rancher/rke2/rke2.yaml \
      | jq -cS '.spec' | sha256sum | awk '{print $1}')
    [[ "${after}" == {{ smoke_blueprint_spec_before_switch.stdout | trim | quote }} ]]
  args:
    executable: /bin/bash
  when:
    - smoke_application_mode == 'logical'
    - smoke_verify_source_switch | bool
  changed_when: false

- name: Report the successful smoke journey
  ansible.builtin.debug:
    msg: >-
      Blueprint {{ smoke_strategy }} workload
      {{ smoke_namespace }}/{{ smoke_workload_name }}-{{ smoke_strategy | lower }}
      is Running through bundle {{ smoke_bundle_name.stdout | trim }} on
      {{ smoke_target_clusters | join(', ') }}{{
        '; its logical Application switched sources without changing the Blueprint'
        if (smoke_application_mode == 'logical' and (smoke_verify_source_switch | bool))
        else '' }}.
