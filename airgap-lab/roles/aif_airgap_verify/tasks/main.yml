---
- name: Wait for the AI Factory operator deployment
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace }} rollout status
      deployment/{{ aif_release_name }} --timeout=5m
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  changed_when: false

- name: Verify the combined UI installation
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace }} wait
      installaiextension/{{ aif_ui_release_name }}
      --for=condition=Ready --timeout=5m
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when: aif_install_mode == 'combined'
  changed_when: false

- name: Verify the separate UI installation
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl -n cattle-ui-plugin-system rollout status
      deployment/{{ aif_ui_release_name }} --timeout=5m
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  when: aif_install_mode == 'separate'
  changed_when: false

- name: Confirm AIF deployments use direct Harbor image references
  ansible.builtin.shell: |
    set -euo pipefail
    ui_deployment={{ (aif_ui_release_name ~ ('-server' if aif_install_mode == 'combined' else '')) | quote }}
    expected_operator={{ (harbor_hostname ~ '/' ~ aif_image_project ~ '/ghcr.io/suse/aif-operator:' ~ aif_image_tag) | quote }}
    expected_ui={{ (harbor_hostname ~ '/' ~ aif_image_project ~ '/ghcr.io/suse/aif-ui:' ~ aif_image_tag) | quote }}
    operator_image=$(/var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} \
      get deployment {{ aif_release_name | quote }} \
      --kubeconfig /etc/rancher/rke2/rke2.yaml \
      -o jsonpath='{.spec.template.spec.containers[0].image}')
    ui_image=$(/var/lib/rancher/rke2/bin/kubectl -n cattle-ui-plugin-system \
      get deployment "${ui_deployment}" \
      --kubeconfig /etc/rancher/rke2/rke2.yaml \
      -o jsonpath='{.spec.template.spec.containers[0].image}')
    [[ "${operator_image}" == "${expected_operator}" ]]
    [[ "${ui_image}" == "${expected_ui}" ]]
    printf 'operator=%s\nui=%s\n' "${operator_image}" "${ui_image}"
  args:
    executable: /bin/bash
  register: aif_deployment_images
  changed_when: false

- name: Confirm Settings and every mirrored catalog are observed
  ansible.builtin.shell: |
    set -euo pipefail
    generation=$(/var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} get settings settings \
      --kubeconfig /etc/rancher/rke2/rke2.yaml -o jsonpath='{.metadata.generation}')
    observed=$(/var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} get settings settings \
      --kubeconfig /etc/rancher/rke2/rke2.yaml -o jsonpath='{.status.observedGeneration}')
    if [[ -z "${observed}" || "${generation}" != "${observed}" ]]; then
      printf 'settings not observed: generation=%s observed=%s\n' \
        "${generation}" "${observed:-<empty>}" >&2
      exit 1
    fi
    for repo in application-collection suse-ai-registry nvidia; do
      repo_generation=$(/var/lib/rancher/rke2/bin/kubectl get clusterrepo "${repo}" \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.metadata.generation}' 2>/dev/null || true)
      repo_observed=$(/var/lib/rancher/rke2/bin/kubectl get clusterrepo "${repo}" \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)
      downloaded=$(/var/lib/rancher/rke2/bin/kubectl get clusterrepo "${repo}" \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.status.downloadTime}' 2>/dev/null || true)
      oci_ready=$(/var/lib/rancher/rke2/bin/kubectl get clusterrepo "${repo}" \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.status.conditions[?(@.type=="OCIDownloaded")].status}' \
        2>/dev/null || true)
      if [[ -z "${downloaded}" || "${repo_generation}" != "${repo_observed}" || "${oci_ready}" != "True" ]]; then
        printf 'clusterrepo %s not ready: generation=%s observed=%s downloadTime=%s OCIDownloaded=%s\n' \
          "${repo}" "${repo_generation:-<empty>}" "${repo_observed:-<empty>}" \
          "${downloaded:-<empty>}" "${oci_ready:-<empty>}" >&2
        exit 1
      fi
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Confirm the private-Gitea chart source configuration
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    repo={{ gitea_chart_clusterrepo | quote }}
    expected_url={{ (gitea_url ~ '/' ~ gitea_admin_username ~ '/' ~ gitea_chart_repository ~ '.git') | quote }}
    token_secret={{ rancher_catalog_token_secret | quote }}

    settings=$("${kubectl}" -n {{ aif_namespace | quote }} get settings settings \
      -o json --kubeconfig "${kubeconfig}")
    jq -e --arg secret "${token_secret}" '
      .spec.rancherCatalog.tokenSecretRef == {name: $secret, key: "token"}
    ' <<<"${settings}" >/dev/null

    object=$("${kubectl}" get clusterrepo "${repo}" -o json --kubeconfig "${kubeconfig}")
    jq -e --arg url "${expected_url}" --arg secret "${repo}-auth" '
      .spec.gitRepo == $url and
      .spec.gitBranch == "main" and
      .spec.clientSecret.name == $secret and
      .spec.clientSecret.namespace == "cattle-system" and
      (.status.commit | length > 0) and
      .metadata.generation == .status.observedGeneration and
      any(.status.conditions[]?; .type == "Downloaded" and .status == "True")
    ' <<<"${object}" >/dev/null

    expected_ca=$(openssl x509 -outform DER -in /var/lib/aif-airgap-lab-ca.crt | sha256sum | awk '{print $1}')
    configured_ca=$(jq -r '.spec.caBundle' <<<"${object}" | base64 -d | sha256sum | awk '{print $1}')
    [[ "${configured_ca}" == "${expected_ca}" ]]
    "${kubectl}" -n cattle-system get secret "${repo}-auth" -o json \
      --kubeconfig "${kubeconfig}" \
      | jq -e '.type == "kubernetes.io/basic-auth" and .data.username and .data.password' >/dev/null
  args:
    executable: /bin/bash
  changed_when: false

- name: Download the private-Gitea chart through AIF's Rancher catalog credential
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    repo={{ gitea_chart_clusterrepo | quote }}
    token_secret={{ rancher_catalog_token_secret | quote }}
    chart_archive=$(mktemp /var/lib/aif-airgap-git-chart.XXXXXX.tgz)
    cleanup() { rm -f -- "${chart_archive}"; }
    trap cleanup EXIT
    token=$("${kubectl}" -n {{ aif_namespace | quote }} get secret "${token_secret}" \
      -o jsonpath='{.data.token}' --kubeconfig "${kubeconfig}" | base64 -d)
    [[ -n "${token}" ]]
    curl --silent --show-error --fail \
      --cacert /var/lib/aif-airgap-rancher-ca.crt \
      --header "Authorization: Bearer ${token}" \
      "{{ rancher_url }}/v1/catalog.cattle.io.clusterrepos/${repo}?link=chart&chartName=airgap-smoke&version={{ smoke_chart_version }}" \
      --output "${chart_archive}"
    chart_metadata=$(helm show chart "${chart_archive}")
    name=$(awk '/^name:/ {print $2; exit}' <<<"${chart_metadata}")
    version=$(awk '/^version:/ {print $2; exit}' <<<"${chart_metadata}")
    if [[ "${name}" != airgap-smoke || "${version}" != {{ smoke_chart_version | quote }} ]]; then
      printf 'unexpected chart metadata: name=%s version=%s\n' "${name}" "${version}" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Confirm the private-Gitea chart deployed through both Fleet workspaces
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    for namespace in fleet-local fleet-default; do
      bundle="airgap-git-chart-multi-gitops-airgap-smoke"
      "${kubectl}" -n "${namespace}" get bundle "${bundle}" -o json \
        --kubeconfig "${kubeconfig}" \
        | jq -e '
            (.spec.helm.chart == "airgap-smoke") and
            any(.spec.resources[]?; .name == "airgap-smoke/Chart.yaml")
          ' >/dev/null
    done
    "${kubectl}" -n {{ smoke_namespace | quote }} get aiworkload \
      airgap-git-chart-multi-gitops -o json --kubeconfig "${kubeconfig}" \
      | jq -e '
          .status.phase == "Running" and
          ([.status.clusterStatuses[] | select(.phase == "Running")] | length == 2)
        ' >/dev/null
  args:
    executable: /bin/bash
  changed_when: false

- name: Confirm private-CA Gitea is trusted by both AIF and Fleet
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    settings=$("${kubectl}" -n {{ aif_namespace | quote }} get settings.ai-factory.suse.com settings \
      -o json --kubeconfig "${kubeconfig}")
    gitrepo=$("${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo \
      -o json --kubeconfig "${kubeconfig}")
    expected_ca=$("${kubectl}" -n {{ aif_namespace | quote }} get secret harbor-ca \
      -o jsonpath='{.data.ca\.crt}' --kubeconfig "${kubeconfig}")
    configured_ca=$(jq -r '.spec.caBundle // ""' <<<"${gitrepo}")
    [[ $(jq -r '.spec.fleet.repoURL' <<<"${settings}") == https://{{ gitea_hostname }}/* ]]
    [[ $(jq -r '.spec.fleet.caBundleSecretRef.name' <<<"${settings}") == harbor-ca ]]
    [[ "${configured_ca}" == "${expected_ca}" ]]
    jq -e '
      .spec.paths == ["blueprints", "workloads"] and
      any(.status.conditions[]?; .type == "GitPolling" and .status == "True") and
      any(.status.conditions[]?; .type == "Accepted" and .status == "True")' \
      <<<"${gitrepo}" >/dev/null
    "${kubectl}" get blueprint git-sourced-airgap-0-1-0 \
      -o jsonpath='{.metadata.labels.airgap-lab\.suse\.com/source}' \
      --kubeconfig "${kubeconfig}" | grep -Fx private-gitea >/dev/null
  args:
    executable: /bin/bash
  when: gitea_tls_enabled | bool
  changed_when: false

- name: Render the pod-level negative egress probe
  ansible.builtin.template:
    src: public-egress-probe.yaml.j2
    dest: /var/lib/aif-airgap-public-egress-probe.yaml
    owner: root
    group: root
    mode: "0600"

- name: Remove only an earlier lab probe pod
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace }} delete pod
      aif-airgap-public-egress-probe --ignore-not-found --wait=true
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  changed_when: true

- name: Start the pod-level negative egress probe
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl apply
      --filename /var/lib/aif-airgap-public-egress-probe.yaml
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  changed_when: true

- name: Require internal access and rejected public access from the pod
  ansible.builtin.shell: |
    set -euo pipefail
    for attempt in $(seq 1 36); do
      phase=$(/var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} \
        get pod aif-airgap-public-egress-probe \
        --kubeconfig /etc/rancher/rke2/rke2.yaml \
        -o jsonpath='{.status.phase}' 2>/dev/null || true)
      [[ "${phase}" == "Succeeded" ]] && exit 0
      [[ "${phase}" == "Failed" ]] && break
      sleep 5
    done
    /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} \
      describe pod aif-airgap-public-egress-probe \
      --kubeconfig /etc/rancher/rke2/rke2.yaml >&2 || true
    /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace | quote }} \
      logs aif-airgap-public-egress-probe \
      --kubeconfig /etc/rancher/rke2/rke2.yaml >&2 || true
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Read the successful pod probe log
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl -n {{ aif_namespace }} logs
      aif-airgap-public-egress-probe
      --kubeconfig /etc/rancher/rke2/rke2.yaml
  register: pod_probe_log
  changed_when: false

- name: Create the control-plane evidence directory
  ansible.builtin.file:
    path: /var/lib/aif-airgap-evidence
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Capture redacted control-plane evidence
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl=/var/lib/rancher/rke2/bin/kubectl
    kubeconfig=/etc/rancher/rke2/rke2.yaml
    {
      printf 'captured_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      printf 'install_mode=%s\n' {{ aif_install_mode | quote }}
      printf 'source_image_tag=%s\n' {{ aif_image_tag | quote }}
      printf 'registry_ca_mode=%s\n' {{ aif_registry_ca_mode | quote }}
      printf 'git_transport=%s\n' {{ ('https' if (gitea_tls_enabled | bool) else 'http') | quote }}
      printf '%s\n' {{ aif_deployment_images.stdout | quote }}
      printf 'pod_probe=%s\n' {{ pod_probe_log.stdout | trim | quote }}
      helm list --all-namespaces --kubeconfig "${kubeconfig}"
      "${kubectl}" get customresourcedefinitions.apiextensions.k8s.io \
        aiworkloads.ai-factory.suse.com blueprints.ai-factory.suse.com \
        installaiextensions.ai-factory.suse.com settings.ai-factory.suse.com \
        -o wide --kubeconfig "${kubeconfig}"
      "${kubectl}" get settings -A -o yaml --kubeconfig "${kubeconfig}"
      "${kubectl}" get clusterrepo application-collection suse-ai-registry nvidia {{ gitea_chart_clusterrepo | quote }} -o yaml --kubeconfig "${kubeconfig}"
      "${kubectl}" -n fleet-local get gitrepo suse-ai-fleet-repo -o yaml --kubeconfig "${kubeconfig}"
      "${kubectl}" get blueprint -o yaml --kubeconfig "${kubeconfig}"
      "${kubectl}" get gitrepo,helmop,bundle -A -o wide --kubeconfig "${kubeconfig}"
      "${kubectl}" get aiworkload -A -o yaml --kubeconfig "${kubeconfig}"
      "${kubectl}" get pods -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,IMAGE:.spec.containers[*].image,IMAGE_ID:.status.containerStatuses[*].imageID,PHASE:.status.phase' --kubeconfig "${kubeconfig}"
      "${kubectl}" get events -A --sort-by=.lastTimestamp --kubeconfig "${kubeconfig}" | tail -n 200
    } > /var/lib/aif-airgap-evidence/control-plane-{{ aif_install_mode }}-{{ aif_registry_ca_mode }}-git-{{ 'https' if (gitea_tls_enabled | bool) else 'http' }}.txt
  args:
    executable: /bin/bash
  changed_when: true

- name: Create the local control-plane evidence destination
  ansible.builtin.file:
    path: "{{ airgap_evidence_dir }}/management"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  run_once: true

- name: Fetch control-plane evidence to the controller
  ansible.builtin.fetch:
    src: /var/lib/aif-airgap-evidence/control-plane-{{ aif_install_mode }}-{{ aif_registry_ca_mode }}-git-{{ 'https' if (gitea_tls_enabled | bool) else 'http' }}.txt
    dest: "{{ airgap_evidence_dir }}/management/"
    flat: false

- name: Report verification result
  ansible.builtin.debug:
    msg:
      - "AIF and UI are Ready from Harbor; all four private chart sources have downloaded."
      - "The authenticated private-Gitea chart source deployed through both Fleet workspaces."
      - "Host and pod public TCP probes were rejected while Harbor and Gitea stayed reachable."
      - "Redacted evidence was fetched under {{ airgap_evidence_dir }}."
