---
# Copy to generated/inventory.yml. Use private addresses on AWS; public
# addresses defeat the isolation model and can break Fleet agent callbacks.
all:
  vars:
    ansible_user: ec2-user
    ansible_become: true
  children:
    aif_management:
      hosts:
        mgmt-rancher:
          ansible_host: 10.0.0.10
    aif_workloads:
      hosts:
        suse-ai:
          ansible_host: 10.0.0.20
    airgap_services:
      hosts:
        airgap-services:
          ansible_host: 10.0.0.30
    # The external suse-ai-node-ansible rke2_server role expects this group.
    # Keep it limited to the dedicated services node when running the lab's
    # bootstrap-services phase.
    rke2_servers:
      hosts:
        airgap-services:
    rke2_airgap_nodes:
      children:
        aif_management:
        aif_workloads:
    airgap_clients:
      hosts: {}
      # Add a browser/test-runner VM here to detect browser-side egress, e.g.:
      # qa-browser:
      #   ansible_host: 10.0.0.40
    airgap_isolated:
      children:
        aif_management:
        aif_workloads:
        airgap_clients:
