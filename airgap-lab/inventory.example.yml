---
# Copy to generated/inventory.yml. Use private addresses on AWS; public
# addresses defeat service routing under isolation. AWS-generated ansible_host
# uses public IPs for SSH; service records and cluster callbacks use private IPs.
all:
  vars:
    ansible_user: ec2-user
    ansible_become: true
  children:
    aif_management:
      hosts:
        mgmt-rancher:
          ansible_host: 10.0.0.10
          airgap_gpu_nodes: []
    aif_workloads:
      hosts:
        suse-ai:
          ansible_host: 10.0.0.20
          airgap_gpu_nodes: []  # list worker node names here when GPUs are present
    aif_workers:
      hosts: {}
      # suse-ai-wkrgpu1:
      #   ansible_host: 10.0.0.21
      #   airgap_cluster_server: suse-ai
    aif_gpu_workers:
      hosts: {}  # include GPU worker names from aif_workers
    airgap_services:
      hosts:
        airgap-services:
          ansible_host: 10.0.0.30
    # The external suse-ai-node-ansible rke2_server role expects this group.
    # Keep it limited to the dedicated services node when running the lab's
    # bootstrap-services phase.
    rke2_servers:
      hosts:
        airgap-services:
    rke2_airgap_nodes:
      children:
        aif_management:
        aif_workloads:
        aif_workers:
    airgap_clients:
      hosts: {}
      # Add a browser/test-runner VM here to detect browser-side egress, e.g.:
      # qa-browser:
      #   ansible_host: 10.0.0.40
    airgap_isolated:
      children:
        rke2_airgap_nodes:
        airgap_clients:
