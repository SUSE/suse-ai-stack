---
- name: Publish and deploy custom CPU-only SUSE application Blueprints
  hosts: aif_management
  gather_facts: false
  become: true
  environment:
    PATH: /usr/local/bin:/var/lib/rancher/rke2/bin:/usr/sbin:/usr/bin:/sbin:/bin
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  roles:
    - role: aif_airgap_suse_apps

- name: Verify the SUSE applications on each selected target cluster
  hosts: rke2_airgap_nodes
  gather_facts: false
  become: true
  environment:
    PATH: /usr/local/bin:/var/lib/rancher/rke2/bin:/usr/sbin:/usr/bin:/sbin:/bin
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Probe the application APIs on the local cluster
      ansible.builtin.include_role:
        name: aif_airgap_suse_apps
        tasks_from: verify
