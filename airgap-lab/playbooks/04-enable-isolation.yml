---
- name: Close public egress on management, workload and browser nodes
  hosts: airgap_isolated
  gather_facts: true
  become: true
  environment:
    PATH: /usr/local/bin:/var/lib/rancher/rke2/bin:/usr/sbin:/usr/bin:/sbin:/bin
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  roles:
    - role: airgap_isolation
