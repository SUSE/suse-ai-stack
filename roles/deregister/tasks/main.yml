# Only called by the destroy playbook
# SLES instances created in AWS are on-demand instances and hence using registercloudguest --clean
# SL-Micro instances created in AWS are BYOL instances
# ok to ignore error during de-registration. Not critical
- name: De-register sles
  become: true
  ansible.builtin.shell: |
    registercloudguest --clean
    SUSEConnect --cleanup
  ignore_errors: true
  when: ansible_distribution == 'SLES'

- name: De-register sl-micro
  become: true
  ansible.builtin.shell: |
    transactional-update run registercloudguest --clean
  ignore_errors: true
  when: ansible_distribution == 'SL-Micro'

- name: Pause
  ansible.builtin.pause:
    minutes: 1
