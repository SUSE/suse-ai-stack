# Only called by the destroy playbook
# Cloud instances are cleaned up with registercloudguest; other systems are
# de-registered from SCC so that the subscription is released.
# ok to ignore error during de-registration. Not critical
- name: Check for transactional-update
  ansible.builtin.stat:
    path: /usr/sbin/transactional-update
  register: deregister_transactional

- name: De-register
  become: true
  ansible.builtin.shell: |
    if command -v registercloudguest >/dev/null; then
      {{ 'transactional-update run ' if deregister_transactional.stat.exists else '' }}registercloudguest --clean
    elif command -v SUSEConnect >/dev/null && ! SUSEConnect --status-text | grep -q 'Not Registered'; then
      {{ 'transactional-update register -d' if deregister_transactional.stat.exists else 'SUSEConnect -d' }}
    fi
  ignore_errors: true

- name: Pause
  ansible.builtin.pause:
    minutes: 1
